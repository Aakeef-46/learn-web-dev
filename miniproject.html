<!DOCTYPE HTML>
<html>
    <head>
        <title>Mini project : card gallery</title>
        <meta name="viewport" content="width:device-width,initial-scale:1.0">
        <style>
            *{
                box-sizing:border-box;
            }
            body{
                background:linear-gradient(45deg,lightpink,purple);
            }
            .head{
                background:pink;
                padding:20px;
                margin:10px;
                text-align:center;
                border-radius:30px 0px;
                border:1px solid rgb(132, 0, 103);
                display:grid;
                grid-template-columns:1fr 1fr 1fr;
                justify-items:center;
                align-items:center;
            }
            h2{
                color:rgb(0, 78, 98);
                font-size:30px;
                font-family:Inter;
                text-decoration:underline;
            }
            .logo{
                width:100px;
                height:50px;
            }
            .sports{
                display:grid;
                grid-template-columns:1fr 1fr 1fr 1fr;
                gap:10px;
                border:1px solid rgb(0, 0, 0);
                padding:5px;
                justify-items:center;
                align-items:center;

            }
            .i{
                height:150px;
                width:200px;
            }
            .adv{
                display:grid;
                grid-template-columns:1fr 1fr 1fr 1fr;
                gap:10px;
                border:1px solid rgb(0, 0, 0);
                padding:5px;
                justify-items:center;
                align-items:center;
            }
            

        </style>
    </head>
    <body>
        <div class="head">
            <div class="h"><img class="logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQX-8k4RsS8RjlQE7oIWRNlY4ZO0xHD17FytEUlj4Bssg&s=10"></div>
            <div class="h"><h2>My  Bike  Gallery</h2></div>
            <div class="h"><img  class="logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQX-8k4RsS8RjlQE7oIWRNlY4ZO0xHD17FytEUlj4Bssg&s=10"></div>
        </div>
        <div class="main">
            <h3>Super Bike Category</h3>
            <div class="sports">
                <h4>1. Ducati Panigale V4</h4>
                <h4>2. Kawasaki H2R</h4>
                <h4>3. BMW S1000RR</h4>
                <h4>4. Suzuki Hayabusa</h4>
                <img class="i" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkPZtDO8YV_-X88NdqX-E7DN5VmT53a4lpHC5z3YnXiFT2l_R55Blzh4oE&s=10">
                 <img  class="i" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6GNyz3ETZ02ZTGq8FF53ywxN8s-UvXGK3Oo5heZ9fjA&s=10">
                <img class="i" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR8GLg7KYmrQW9tjjCrqm0IzyCQEPNvsUyXP9hssGg4gA&s=10">
                <img class="i" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmM-Jgr7voSvEq3ZsPfqvIt1sNmEsXHvMSVGLKeoPG6Q&s=10">
            </div>
            <h3>Sports Category</h3>
             <div class="adv">
                   <h4>1. Yamaha R15</h4>
                <h4>2. Aprilia RS457</h4>

                 <img  class="i" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcuAhQl0PdmE5dn34w9TpfhQt2kAJUF7Ju_d1D5Oc4PA&s=10">

                <img class="i" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRFdyhRbxPp-FUkGKECKILM-cE0S1lIB78MdHrbH_w6hg&s=10">

             </div>
