<!DOCTYPE HTML>
<html>
    <head>
        <title>Day 3 : CSS </title>
        <meta name="viewport" content="width:device-width,initial-scale=1.0">
        <style>
            body{
                background:linear-gradient(to right,lightpink,purple);
            }
            #n{
                font-size:24px;
                font-family:Helvetica,sans-serif;
                text-align:center;
            }
            .m{
                background:rgb(24, 201, 142);
                font-size:24px;
            }
            li{
                color:yellow;
            }
            h3{
                color:red;
                font-weight:bold;
                text-decoration:underline;
            }
            h1{
                text-align:center;
            }
        </style>
    </head>
    <body>
        <h1 style="color:white;">CSS Cascading Style Sheets</h1>
        <p id="n">today i learned about three type of css , selectors , colors and fonts  </p>

        <div class="m">
          <ol><h3>Fruits</h3>
             <li>apple</li>
             <li>banana</li>
             <li>orange</li>
          </ol>
        </div>

    </body>
